<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Azulín</title>
  <!-- GitHub Pages: CodersPlug/mario-platformer -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <strong>AZULÍN</strong>
      </div>
      <div class="tools">
        <button type="button" id="btnRestart" class="icon-tool" aria-label="Reiniciar" title="Reiniciar">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M38 24a14 14 0 1 1-4.1-9.9" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M36 8v10h-10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="stage-wrap">
      <canvas id="world"></canvas>
    </div>

    <footer class="dock">
      <div class="spawn-grid" id="spawnGrid">
        <button type="button" data-spawn="barrel" class="icon-btn" aria-label="Barril">
          <svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="10" rx="12" ry="5" fill="#7aa0ff"/><rect x="12" y="10" width="24" height="28" rx="6" fill="#6c8cff"/><ellipse cx="24" cy="38" rx="12" ry="5" fill="#4d6fd4"/><path d="M14 18h20M14 26h20M14 32h20" stroke="#2f458f" stroke-width="2"/></svg>
        </button>
        <button type="button" data-spawn="crate" class="icon-btn" aria-label="Caja">
          <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="10" width="32" height="28" rx="3" fill="#c48a4a" stroke="#7a5228" stroke-width="2"/><path d="M8 18h32M24 10v28M14 10l20 28M34 10L14 38" stroke="#7a5228" stroke-width="2"/></svg>
        </button>
        <button type="button" data-spawn="ball" class="icon-btn" aria-label="Pelota">
          <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="14" fill="#ff6b6b" stroke="#9b3030" stroke-width="2"/><path d="M10 24h28M24 10c6 6 6 22 0 28M24 10c-6 6-6 22 0 28" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/></svg>
        </button>
        <button type="button" data-spawn="plank" class="icon-btn" aria-label="Tabla">
          <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="20" width="40" height="10" rx="2" fill="#d7b07a" stroke="#8a6a3d" stroke-width="2"/><path d="M10 20v10M24 20v10M38 20v10" stroke="#8a6a3d" stroke-width="1.5"/></svg>
        </button>
        <button type="button" data-spawn="cone" class="icon-btn" aria-label="Cono">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 8L38 38H10Z" fill="#ff9f43" stroke="#a85b10" stroke-width="2"/><path d="M16 28h16" stroke="#fff" stroke-width="3"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="matter.min.js"></script>
  <script src="sounds.js"></script>
  <script src="game.js"></script>
</body>
</html>
