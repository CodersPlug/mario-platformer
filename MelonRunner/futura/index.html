<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Cuando sea vieja</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
    // Runtime cache-buster: GitHub Pages caches assets for 10 min and iOS
    // Safari is aggressive. Load CSS/JS with a per-load token.
    window.__FUTURA_BUILD = 10;
    (function () {
      var t = Date.now();
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = "style.css?b=" + window.__FUTURA_BUILD + "&t=" + t;
      document.head.appendChild(l);
    })();
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">
        <svg class="brand-svg" viewBox="0 0 160 48" aria-hidden="true">
          <!-- baby -->
          <circle cx="22" cy="24" r="14" fill="#ffd6a8"/>
          <circle cx="17" cy="22" r="1.8" fill="#3a2a28"/>
          <circle cx="27" cy="22" r="1.8" fill="#3a2a28"/>
          <path d="M17 29c2.5 2.5 7.5 2.5 10 0" fill="none" stroke="#3a2a28" stroke-width="1.8" stroke-linecap="round"/>
          <!-- arrow -->
          <path d="M48 24h28" stroke="#e23d6d" stroke-width="3" stroke-linecap="round"/>
          <path d="M70 16l10 8-10 8" fill="none" stroke="#e23d6d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- sparkles -->
          <circle cx="90" cy="14" r="2.2" fill="#ffc44d"/>
          <circle cx="98" cy="34" r="1.6" fill="#6ec8ff"/>
          <!-- elder -->
          <circle cx="130" cy="24" r="14" fill="#f0e0d0"/>
          <path d="M116 18c6-10 22-10 28 0" fill="#f5f5f8"/>
          <circle cx="125" cy="23" r="1.6" fill="#3a2a28"/>
          <circle cx="135" cy="23" r="1.6" fill="#3a2a28"/>
          <path d="M124 30c3 2.2 9 2.2 12 0" fill="none" stroke="#3a2a28" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M118 28c2 4 6 6 12 6s10-2 12-6" fill="none" stroke="rgba(90,60,50,0.35)" stroke-width="1.4"/>
        </svg>
      </div>
      <span id="buildTag" class="build-tag" aria-hidden="true"></span>
      <button type="button" id="btnAgain" class="icon-btn corner" hidden aria-label="Otra foto">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M14 18a14 14 0 1 1-2 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M10 10v10h10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <main class="viewport">
      <section id="screenAsk" class="screen">
        <div id="cameraBox" class="camera-frame">
          <video id="video" playsinline autoplay muted></video>
          <canvas id="snap" hidden></canvas>
          <div id="camStatus" class="cam-status" hidden aria-hidden="true">
            <span class="pulse-dot"></span>
          </div>
        </div>
        <button type="button" id="btnShoot" class="cam-btn" aria-label="Tomar foto" disabled>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <rect x="8" y="18" width="48" height="34" rx="8" fill="none" stroke="currentColor" stroke-width="4"/>
            <circle cx="32" cy="35" r="11" fill="none" stroke="currentColor" stroke-width="4"/>
            <path d="M22 18l4-8h12l4 8" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="46" cy="26" r="2.5" fill="currentColor"/>
          </svg>
        </button>
      </section>

      <section id="screenPreview" class="screen" hidden>
        <div class="photo-frame">
          <canvas id="preview"></canvas>
        </div>
        <div class="preview-actions">
          <button type="button" id="btnRetake" class="cam-btn ghost" aria-label="Repetir foto">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M14 18a14 14 0 1 1-2 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
              <path d="M10 10v10h10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button" id="btnUsePhoto" class="cam-btn ok" aria-label="Usar esta foto">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M14 34l12 12 24-26" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>

      <section id="screenProgress" class="screen" hidden>
        <div class="progress-stage" aria-busy="true" aria-label="Procesando">
          <div class="progress-orbit">
            <div id="progressFace" class="progress-face face-kid" aria-hidden="true"></div>
            <div class="orbit-ring"></div>
            <div class="spark s1"></div>
            <div class="spark s2"></div>
            <div class="spark s3"></div>
          </div>
          <div class="bar-track" aria-hidden="true">
            <div id="barFill" class="bar-fill"></div>
          </div>
          <div id="progressTicks" class="progress-ticks" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </section>

      <section id="screenResult" class="screen" hidden>
        <div class="photo-frame result-frame">
          <canvas id="out"></canvas>
          <div id="redrawFlash" class="redraw-flash" hidden aria-hidden="true"></div>
          <div id="busyOverlay" class="busy-overlay" hidden aria-hidden="true">
            <div class="busy-spinner"></div>
          </div>
          <div id="stageBadge" class="stage-badge" aria-hidden="true">
            <span id="stageIcon" class="stage-icon face-kid"></span>
          </div>
        </div>
        <div id="manualAge" class="manual-icons" hidden>
          <button type="button" class="stage-pick" data-age="4" aria-label="Bebé">
            <span class="stage-icon face-baby"></span>
          </button>
          <button type="button" class="stage-pick" data-age="8" aria-label="Niña">
            <span class="stage-icon face-kid"></span>
          </button>
          <button type="button" class="stage-pick" data-age="16" aria-label="Joven">
            <span class="stage-icon face-teen"></span>
          </button>
          <button type="button" class="stage-pick" data-age="35" aria-label="Adulta">
            <span class="stage-icon face-adult"></span>
          </button>
          <button type="button" class="stage-pick" data-age="70" aria-label="Abuela">
            <span class="stage-icon face-elder"></span>
          </button>
        </div>
      </section>
    </main>

    <footer id="ageDock" class="age-dock" hidden>
      <div class="dock-icons">
        <span class="stage-icon face-baby dock-end" aria-hidden="true"></span>
        <span id="ageReadout" class="age-num" aria-hidden="true">—</span>
        <span class="stage-icon face-elder dock-end" aria-hidden="true"></span>
      </div>
      <input id="ageSlider" type="range" min="1" max="100" value="30" step="1" aria-label="Edad" />
    </footer>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
  <script>
    (function () {
      var s = document.createElement("script");
      s.defer = true;
      s.src = "app.js?b=" + window.__FUTURA_BUILD + "&t=" + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
