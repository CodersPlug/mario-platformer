<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Cuando sea vieja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="brand">Cuando sea vieja</h1>
      <button type="button" id="btnAgain" class="icon-btn" hidden aria-label="Otra foto">↺</button>
    </header>

    <main class="viewport">
      <!-- 1. Pedir imagen -->
      <section id="screenAsk" class="screen">
        <div class="ask-card">
          <p class="ask-title">¿Cómo te ves hoy?</p>
          <p class="ask-sub">Una foto por sesión. Se procesa en tu iPad; no se sube.</p>
          <div class="ask-actions">
            <button type="button" id="btnCamera" class="primary">Cámara frontal</button>
            <label class="primary secondary file-btn">
              Elegir imagen
              <input id="fileInput" type="file" accept="image/*" hidden />
            </label>
          </div>
        </div>

        <div id="cameraBox" class="camera-frame" hidden>
          <video id="video" playsinline autoplay muted></video>
          <canvas id="snap" hidden></canvas>
          <button type="button" id="btnShoot" class="primary shoot floating">Tomar foto</button>
        </div>
      </section>

      <!-- 2. Progreso -->
      <section id="screenProgress" class="screen" hidden>
        <div class="progress-card">
          <p id="progressTitle" class="ask-title">Procesando…</p>
          <p id="progressDetail" class="ask-sub">Preparando</p>
          <div class="bar-track" aria-hidden="true">
            <div id="barFill" class="bar-fill"></div>
          </div>
          <p id="progressPct" class="progress-pct">0%</p>
        </div>
      </section>

      <!-- 3. Resultado -->
      <section id="screenResult" class="screen" hidden>
        <div class="photo-frame">
          <canvas id="out"></canvas>
          <p id="ageBadge" class="age-badge">—</p>
        </div>
        <div id="ageAnnounce" class="announce" role="status" aria-live="polite">
          <p class="announce-kicker">Edad detectada</p>
          <p id="announceAge" class="announce-age">—</p>
          <p id="statusLine" class="status">Mové el slider para viajar en el tiempo.</p>
        </div>
        <div id="manualAge" class="manual" hidden>
          <p>No pudimos estimar la edad. ¿Cuántos años tenés?</p>
          <div class="manual-row">
            <input id="manualInput" type="number" min="1" max="100" inputmode="numeric" />
            <button type="button" id="btnManualOk" class="primary shoot">Usar</button>
          </div>
        </div>
      </section>
    </main>

    <footer id="ageDock" class="age-dock" hidden>
      <div class="dock-labels">
        <span>Más joven</span>
        <strong id="ageReadout">—</strong>
        <span>Más grande</span>
      </div>
      <input id="ageSlider" type="range" min="1" max="100" value="30" step="1" aria-label="Edad" />
      <p id="storyLine" class="story"></p>
    </footer>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
