name: Deploy Melon Libre to GitHub Pages

on:
  push:
    branches: [main, cursor/melon-runner-azulin-84c3]
    paths:
      - "MelonRunner/play/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload MelonRunner/play
        uses: actions/upload-pages-artifact@v3
        with:
          path: MelonRunner/play
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
