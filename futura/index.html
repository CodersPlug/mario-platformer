<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Cuando sea vieja</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <script>window.__FUTURA_BUILD = 14;</script>
  <link rel="stylesheet" href="style.v14.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">
        <svg class="brand-svg" viewBox="0 0 160 48" aria-hidden="true">
          <circle cx="22" cy="24" r="14" fill="#ffd6a8"/>
          <circle cx="17" cy="22" r="1.8" fill="#3a2a28"/>
          <circle cx="27" cy="22" r="1.8" fill="#3a2a28"/>
          <path d="M17 29c2.5 2.5 7.5 2.5 10 0" fill="none" stroke="#3a2a28" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M48 24h28" stroke="#e23d6d" stroke-width="3" stroke-linecap="round"/>
          <path d="M70 16l10 8-10 8" fill="none" stroke="#e23d6d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="90" cy="14" r="2.2" fill="#ffc44d"/>
          <circle cx="98" cy="34" r="1.6" fill="#6ec8ff"/>
          <circle cx="130" cy="24" r="14" fill="#f0e0d0"/>
          <path d="M116 18c6-10 22-10 28 0" fill="#f5f5f8"/>
          <circle cx="125" cy="23" r="1.6" fill="#3a2a28"/>
          <circle cx="135" cy="23" r="1.6" fill="#3a2a28"/>
          <path d="M124 30c3 2.2 9 2.2 12 0" fill="none" stroke="#3a2a28" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <span id="buildTag" class="build-tag" aria-hidden="true">14</span>
      <button type="button" id="btnAgain" class="icon-btn corner" hidden aria-label="Otra foto">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M14 18a14 14 0 1 1-2 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M10 10v10h10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <main class="viewport">
      <section id="screenAsk" class="screen">
        <div id="cameraBox" class="camera-frame">
          <video id="video" playsinline autoplay muted></video>
          <canvas id="snap" hidden></canvas>
          <div id="camStatus" class="cam-status" hidden><span class="pulse-dot"></span></div>
        </div>
        <button type="button" id="btnShoot" class="cam-btn" aria-label="Tomar foto" disabled>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <rect x="8" y="18" width="48" height="34" rx="8" fill="none" stroke="currentColor" stroke-width="4"/>
            <circle cx="32" cy="35" r="11" fill="none" stroke="currentColor" stroke-width="4"/>
            <path d="M22 18l4-8h12l4 8" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="46" cy="26" r="2.5" fill="currentColor"/>
          </svg>
        </button>
      </section>

      <section id="screenPreview" class="screen" hidden>
        <div class="photo-frame"><canvas id="preview"></canvas></div>
        <div class="preview-actions">
          <button type="button" id="btnRetake" class="cam-btn ghost" aria-label="Repetir">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M14 18a14 14 0 1 1-2 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
              <path d="M10 10v10h10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button" id="btnUsePhoto" class="cam-btn ok" aria-label="Usar">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M14 34l12 12 24-26" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>

      <section id="screenProgress" class="screen" hidden>
        <div class="progress-stage" aria-busy="true">
          <div class="progress-orbit">
            <div id="progressFace" class="progress-face face-kid"></div>
            <div class="orbit-ring"></div>
            <div class="spark s1"></div>
            <div class="spark s2"></div>
            <div class="spark s3"></div>
          </div>
          <div class="bar-track"><div id="barFill" class="bar-fill"></div></div>
          <div id="progressTicks" class="progress-ticks">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </section>

      <section id="screenResult" class="screen" hidden>
        <div class="photo-frame result-frame" id="resultFrame">
          <img id="outImg" class="out-img" alt="" draggable="false" />
          <div id="busyOverlay" class="busy-overlay" hidden aria-busy="true">
            <div class="gen-cue" aria-hidden="true">
              <div class="gen-ring"></div>
              <div class="gen-face face-kid" id="genFace"></div>
              <div class="gen-bar"><i id="genBarFill"></i></div>
            </div>
          </div>
        </div>
        <div id="manualAge" class="manual-icons" hidden>
          <button type="button" class="stage-pick" data-age="8"><span class="stage-icon face-kid"></span></button>
          <button type="button" class="stage-pick" data-age="35"><span class="stage-icon face-adult"></span></button>
          <button type="button" class="stage-pick" data-age="70"><span class="stage-icon face-elder"></span></button>
        </div>
      </section>
    </main>

    <footer id="ageDock" class="age-dock" hidden>
      <div id="ageReadout" class="age-num">—</div>
      <div id="scrub" class="scrub" role="slider" aria-valuemin="1" aria-valuemax="100" aria-valuenow="30" tabindex="0">
        <div class="scrub-track"></div>
        <div id="scrubFill" class="scrub-fill"></div>
        <div id="scrubThumb" class="scrub-thumb"></div>
      </div>
    </footer>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script defer src="fran.js?b=14"></script>
  <script defer src="app.v14.js"></script>
</body>
</html>
