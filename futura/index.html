<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Cuando sea vieja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="brand">Cuando sea vieja</h1>
      <button type="button" id="btnAgain" class="icon-btn corner" hidden aria-label="Otra foto">↺</button>
    </header>

    <main class="viewport">
      <!-- 1. Cámara en vivo -->
      <section id="screenAsk" class="screen">
        <div id="cameraBox" class="camera-frame">
          <video id="video" playsinline autoplay muted></video>
          <canvas id="snap" hidden></canvas>
          <p id="camStatus" class="cam-status" hidden></p>
        </div>
        <button type="button" id="btnShoot" class="cam-btn" aria-label="Tomar foto" disabled>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <rect x="8" y="18" width="48" height="34" rx="8" fill="none" stroke="currentColor" stroke-width="4"/>
            <circle cx="32" cy="35" r="11" fill="none" stroke="currentColor" stroke-width="4"/>
            <path d="M22 18l4-8h12l4 8" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="46" cy="26" r="2.5" fill="currentColor"/>
          </svg>
        </button>
      </section>

      <!-- 2. Previsualizar antes de detectar -->
      <section id="screenPreview" class="screen" hidden>
        <div class="photo-frame">
          <canvas id="preview"></canvas>
        </div>
        <div class="preview-actions">
          <button type="button" id="btnRetake" class="cam-btn ghost" aria-label="Repetir foto">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <rect x="8" y="18" width="48" height="34" rx="8" fill="none" stroke="currentColor" stroke-width="4"/>
              <circle cx="32" cy="35" r="11" fill="none" stroke="currentColor" stroke-width="4"/>
              <path d="M22 18l4-8h12l4 8" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button" id="btnUsePhoto" class="cam-btn ok" aria-label="Usar esta foto">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M14 34l12 12 24-26" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- 3. Progreso -->
      <section id="screenProgress" class="screen" hidden>
        <div class="progress-card">
          <p id="progressTitle" class="ask-title">Procesando…</p>
          <p id="progressDetail" class="ask-sub">Preparando</p>
          <div class="bar-track" aria-hidden="true">
            <div id="barFill" class="bar-fill"></div>
          </div>
          <p id="progressPct" class="progress-pct">0%</p>
        </div>
      </section>

      <!-- 4. Resultado -->
      <section id="screenResult" class="screen" hidden>
        <div class="photo-frame">
          <canvas id="out"></canvas>
          <p id="ageBadge" class="age-badge">—</p>
        </div>
        <div id="ageAnnounce" class="announce" role="status" aria-live="polite">
          <p class="announce-kicker">Edad detectada</p>
          <p id="announceAge" class="announce-age">—</p>
          <p id="statusLine" class="status">Mové el slider para viajar en el tiempo.</p>
        </div>
        <div id="manualAge" class="manual" hidden>
          <p>No pudimos estimar la edad. ¿Cuántos años tenés?</p>
          <div class="manual-row">
            <input id="manualInput" type="number" min="1" max="100" inputmode="numeric" />
            <button type="button" id="btnManualOk" class="primary shoot">Usar</button>
          </div>
        </div>
      </section>
    </main>

    <footer id="ageDock" class="age-dock" hidden>
      <div class="dock-labels">
        <span>Más joven</span>
        <strong id="ageReadout">—</strong>
        <span>Más grande</span>
      </div>
      <input id="ageSlider" type="range" min="1" max="100" value="30" step="1" aria-label="Edad" />
      <p id="storyLine" class="story"></p>
    </footer>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
